[project]
name = "ag-ui-gallery-backend"
version = "0.1.0"
description = "Shared demo backend for the AG-UI framework integration gallery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15",
    # The service/selector layer. One spec set, declared once in a SpecRegistry,
    # projected to HTTP (viewsets) and to the agent (spec tools). The floor is 0.40
    # because the board raises `ServiceNotFound` and `ServiceConflict`, which is
    # where they arrived.
    "djangorestframework-services>=0.40",
    # The AG-UI transport. [spec-tools] is the in-process bridge that turns the
    # same specs into agent tools with no MCP hop. The floor is 0.43 for
    # `approval_prompts`: without it the approval card asks the serialized call.
    #
    # [harness] is the one extra in this gallery that costs a dependency rather
    # than a line: it pulls pydantic-ai-harness, which backs the step store the
    # checkpoint panel lists runs from. Both extras belong to one requirement --
    # naming django-ag-ui twice would leave whichever uv resolves last.
    "django-ag-ui[spec-tools,harness]>=0.45",
    # Declared because this backend imports it directly -- `ToolGuardConfig`,
    # `AgentDeps`, and `contrib.store` both as an app and as an import path. It
    # arrives transitively through django-ag-ui either way, which is exactly why a
    # direct import of it has to be declared: a transitive floor is somebody
    # else's promise.
    # 0.16 for the attachment store, which this gallery exercises directly:
    # below it, an attachment whose bytes had left storage raised instead of
    # reporting itself unavailable, and re-uploading the file adopted the same
    # missing blob rather than repairing it.
    "django-pydantic-agent>=0.16",
    # The admin surface: the same board through django.contrib.admin, with the
    # agent in the admin sidebar and the vendored web-component bundle. The floor
    # is 0.24, which vendors web component 0.24.0: earlier bundles abandon a
    # sidebar run at its first navigating tool once the thread has stored history
    # (fixed in 0.23), and earlier still than that the approved call's card breaks
    # its own name across three lines in a panel this width.
    "django-admin-agent>=0.25",
    # ASGI is required: the agent endpoint streams.
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.settings"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
