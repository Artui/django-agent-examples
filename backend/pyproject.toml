[project]
name = "ag-ui-gallery-backend"
version = "0.1.0"
description = "Shared demo backend for the AG-UI framework integration gallery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Two rules this list follows, both of them learned the hard way.
#
# 1. **Every distribution this backend imports is named here**, even when it would
#    arrive transitively anyway. A transitive floor is somebody else's promise: it
#    holds until the package in the middle drops the dependency, or relaxes it, and
#    then a reader who copied one of these files gets an ImportError with nothing
#    in their own pyproject.toml explaining what was supposed to supply it.
#    `tests/test_dependencies_are_declared.py` enforces it rather than trusting
#    this comment.
#
# 2. **A version number appears in the pin and nowhere else.** A justification that
#    restates the number goes stale the moment the pin moves -- silently, because
#    nothing reads a comment. So each note below says *what* the floor buys and
#    lets the requirement on the next line say *which release* that is.
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15",
    # The service/selector layer. One spec set, declared once in a SpecRegistry,
    # projected to HTTP (viewsets) and to the agent (spec tools). The floor is
    # where `ServiceNotFound` and `ServiceConflict` arrived, which the board
    # raises.
    # Raised to 0.49, which bounds the schema recursion a self-referential
    # serializer used to crash. The board declares nested serializers and both
    # transports here build a schema per spec, so the crash was reachable from
    # the demo rather than theoretical.
    "djangorestframework-services>=0.49",
    # Declared because `board/serializers.py` imports `DataclassSerializer`
    # directly: the board's operation *inputs* are dataclasses, so one declaration
    # validates an HTTP body and reflects into the schema the agent sees. It also
    # arrives under djangorestframework-services, which is rule 1's case exactly.
    "djangorestframework-dataclasses>=1.3.1",
    # The AG-UI transport. [spec-tools] is the in-process bridge that turns the
    # same specs into agent tools with no MCP hop, and `approval_prompts` is what
    # makes the approval card ask a readable question instead of the serialized
    # call.
    #
    # The floor is where a failing run stopped streaming the raw exception text
    # to the browser. Pydantic-AI builds `RUN_ERROR` as `str(error)`, so an
    # exception's own words reached the transcript -- and those words are written
    # for an operator, not a reader. Below this floor the checkpoint test's
    # refusal arrives verbatim; at it and above, the browser gets a fixed
    # sentence and the detail goes to the audit logger instead. Both halves are
    # asserted, because redacting while dropping the detail would look identical
    # from the client.
    #
    # It also carries the release that first requires a django-pydantic-agent
    # holding the attachment fix described below. This transport seeds later
    # turns from the client transcript, and this gallery imports a CSV and then
    # keeps talking about it -- which is the multi-turn shape that bug spoiled.
    #
    # [harness] is the one extra in this gallery that costs a dependency rather
    # than a line: it pulls pydantic-ai-harness, which backs the step store the
    # checkpoint panel lists runs from. Both extras belong to one requirement --
    # naming django-ag-ui twice would leave whichever uv resolves last.
    # 0.53 routes a delegated sub-agent's progress onto the SSE stream, which the
    # frontends now draw, and stamps every CUSTOM event with a wall clock.
    "django-ag-ui[spec-tools,harness]>=0.53",
    # Declared because this backend imports it directly -- `ToolGuardConfig`,
    # `AgentDeps`, and `contrib.store` both as an app and as an import path.
    #
    # The floor is where `ToolGuard` learned the vocabulary an in-process spec
    # tool actually speaks. Below it the guard read only the destructive metadata
    # key the drf-mcp bridge stamps, while a spec reaching the agent through
    # `service_specs=` carries `annotations["readOnlyHint"]` instead and nothing
    # translated between them -- so a board write ran unapproved with the guard
    # enabled and the approval card never shown.
    #
    # This gallery is the shape that defect targets, and it was saved only by
    # naming all three writes in `require_approval`. Verified rather than
    # reasoned: drop `create_event` from that set and the deferral disappears at
    # the old floor while it still holds at this one. A floor that holds because
    # of how the config next door happens to be written is not a floor.
    #
    # The release also fixed an attached file's tool result claiming more than it
    # could keep -- the bytes never travel the event stream, so a later turn
    # replayed "its contents are attached" with nothing attached and the model
    # answered confidently about a document it had never read, with no error
    # anywhere. This gallery imports a CSV and then keeps talking about it, which
    # is exactly that multi-turn shape.
    "django-pydantic-agent>=0.21",
    # The admin surface: the same board through django.contrib.admin, with the
    # agent in the admin sidebar and the vendored web-component bundle.
    #
    # The floor is where the sidebar's conversation became scoped to the
    # signed-in principal. The component keeps it in `sessionStorage`, which is
    # scoped to the *tab* and not to the session, so it outlives the navigation a
    # logout is -- and a shared demo machine is exactly the shape that bites:
    # one browser, several principals, the next one landing on the last one's
    # transcript. `tests/test_admin_surface.py` asserts the attribute is
    # rendered, so this floor is load-bearing rather than aspirational.
    #
    # Raised by that same argument rather than by a version sweep. 0.32.1 is the
    # release that vendors web component 0.31.1, which is what the four frontends
    # here now resolve; 0.32.0 still carries 0.31.0 of it. Below this
    # floor the admin surface and the frontends run different builds of one
    # component, and a gallery demonstrating two versions of the same thing is
    # worse than a gallery one release behind.
    #
    # 0.31.0 of the component is also where the rating buttons became opt-in --
    # they fire `ag-ui-feedback` and store nothing, nothing here listens, and
    # before that they latched on click and told a reader a rating had been
    # taken. Four frontends and an admin sidebar all showed them.
    "django-admin-agent>=0.32.1",
    # Declared because `agent/tools.py` and `agent/scripted.py` import it
    # directly: `RunContext` and `ToolReturn` for the server-side tools, and
    # `FunctionModel` plus the message parts for the scripted stand-in. It arrives
    # under django-ag-ui and django-pydantic-agent both, which is why rule 1
    # exists at all -- this is the file whose own comment says so.
    #
    # `-slim`, not the `pydantic-ai` meta package: which provider extra to install
    # is the reader's choice, and `agent/model.py` says how to make it. No floor
    # above the major, because every surface named above has been there since the
    # 2 line opened; the ceiling is there because a major is a different library.
    "pydantic-ai-slim>=2,<3",
    # Declared because `agent/tools.py` builds a `StateSnapshotEvent` itself --
    # the AG-UI wire type that carries shared state back to the page. Rule 1
    # again: it is django-ag-ui's dependency, and this backend's import.
    "ag-ui-protocol>=0.1.19",
    # ASGI is required: the agent endpoint streams.
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.9",
    # Rule 1 covers the tests too: `tests/test_admin_surface.py` imports
    # `sync_to_async` itself rather than reaching it through Django.
    "asgiref>=3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.settings"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
