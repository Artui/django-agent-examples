[project]
name = "ag-ui-gallery-backend"
version = "0.1.0"
description = "Shared demo backend for the AG-UI framework integration gallery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Two rules this list follows, both of them learned the hard way.
#
# 1. **Every distribution this backend imports is named here**, even when it would
#    arrive transitively anyway. A transitive floor is somebody else's promise: it
#    holds until the package in the middle drops the dependency, or relaxes it, and
#    then a reader who copied one of these files gets an ImportError with nothing
#    in their own pyproject.toml explaining what was supposed to supply it.
#    `tests/test_dependencies_are_declared.py` enforces it rather than trusting
#    this comment.
#
# 2. **A version number appears in the pin and nowhere else.** A justification that
#    restates the number goes stale the moment the pin moves -- silently, because
#    nothing reads a comment. So each note below says *what* the floor buys and
#    lets the requirement on the next line say *which release* that is.
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15",
    # The service/selector layer. One spec set, declared once in a SpecRegistry,
    # projected to HTTP (viewsets) and to the agent (spec tools). The floor is
    # where schema generation stopped recursing without bound on a serializer
    # that nests itself. The board declares nested serializers and both
    # transports here build a schema per spec, so that crash was reachable from
    # the demo rather than theoretical. It is also past where `ServiceNotFound`
    # and `ServiceConflict` arrived, which the board raises.
    #
    # Raised since with the transport, whose [spec-tools] extra requires it
    # through djangorestframework-pydantic-ai, so the floor declared here is not
    # left below the one that resolves. That is the whole reason: nothing this
    # suite observes moved with it.
    #
    # Raised again on that reasoning, and this time what resolves it is a hard
    # requirement rather than a tidy one: djangorestframework-pydantic-ai passes
    # `many_as_argument` on every spec call, and that argument first exists at
    # this floor, so below it every spec tool call raises `TypeError`. The
    # package still imports, so the failure waits for a call rather than for a
    # resolve. Still nothing this suite observes moved with it -- no spec the
    # board declares is `many=True`.
    "djangorestframework-services>=0.53.0",
    # Declared because `board/serializers.py` imports `DataclassSerializer`
    # directly: the board's operation *inputs* are dataclasses, so one declaration
    # validates an HTTP body and reflects into the schema the agent sees. It also
    # arrives under djangorestframework-services, which is rule 1's case exactly.
    "djangorestframework-dataclasses>=1.3.1",
    # The AG-UI transport. [spec-tools] is the in-process bridge that turns the
    # same specs into agent tools with no MCP hop, and `approval_prompts` is what
    # makes the approval card ask a readable question instead of the serialized
    # call.
    #
    # The floor is where a failing run stopped streaming the raw exception text
    # to the browser. Pydantic-AI builds `RUN_ERROR` as `str(error)`, so an
    # exception's own words reached the transcript -- and those words are written
    # for an operator, not a reader. Below this floor the checkpoint test's
    # refusal arrives verbatim; at it and above, the browser gets a fixed
    # sentence and the detail goes to the audit logger instead. Both halves are
    # asserted, because redacting while dropping the detail would look identical
    # from the client.
    #
    # It also carries the release that first requires a django-pydantic-agent
    # holding the attachment fix described below. This transport seeds later
    # turns from the client transcript, and this gallery imports a CSV and then
    # keeps talking about it -- which is the multi-turn shape that bug spoiled.
    #
    # [harness] is the one extra in this gallery that costs a dependency rather
    # than a line: it pulls pydantic-ai-harness, which backs the step store the
    # checkpoint panel lists runs from. Both extras belong to one requirement --
    # naming django-ag-ui twice would leave whichever uv resolves last.
    # The floor is where a delegated sub-agent's lifetime moved onto the
    # protocol's own SUBAGENT_STARTED / _FINISHED / _ERROR events, and what it
    # buys is currency rather than a capability: this backend delegates to no
    # sub-agent, so nothing here emits those events at all. The reason to take
    # it anyway is the one this repo exists for -- a gallery demonstrates the
    # family at the versions that just shipped, and the transport is the thing
    # it demonstrates most directly.
    #
    # The comment this replaced claimed the floor was for progress "the
    # frontends now draw". They can draw it; nothing here produces one. Checked
    # in a browser rather than argued: the React app and the admin surface both
    # render a delegating agent's panel only if something delegates, and no
    # scenario in this repo does.
    #
    # Three things this floor buys, none of them restating which release each
    # was -- the number lives in the pin, and a comment that repeats it is one
    # more place to go stale.
    #
    # An endpoint with no model is refused at the mount rather than one request
    # later. This backend builds four endpoints and configures a model for all
    # of them, so nothing here changes; that was the finding worth having,
    # because mount time is exactly when a consumer building its view before
    # settings are complete would break, and the suite was run against the
    # unreleased branch to check that this one does not.
    #
    # `TOOL_CALL_RESULT` carries an `outcome`, so a tool call this gallery's
    # board refuses reaches the chat marked failed instead of arriving as a card
    # indistinguishable from a success. The [spec-tools] extra pulls the half
    # that makes the marking true rather than merely present: below it a spec
    # tool's conflict is an ordinary return, which the transport would forward
    # as a success for a call that failed.
    #
    # `FORWARD_REASONING` is documented honestly. It had been described as
    # though a chain-of-thought could only reach a browser once an operator
    # enabled a thinking budget, which is not something a consumer can rely on.
    # A gallery is read as a worked example, so it should not be the place
    # someone learns a guarantee that was never there.
    #
    # The latest move carries that refusal marking one route over: a tool bridged
    # from `drf_mcp_server=` that its server refuses now reaches the browser
    # marked failed, as a `service_specs=` tool's already did. This backend
    # bridges no MCP server, so nothing here changes. The [spec-tools] half moves
    # with it and does reach this route: a refusal an affordance issues ends with
    # the rule's code, a tool that finds nothing answers `None` rather than a row
    # of empty fields, and a `many=True` service spec is refused when the toolset
    # is built. The board declares no affordance, every one of its tools answers
    # with an event or a list of them, and no spec is `many=True`, so this suite
    # reads the same at either floor; the reason to take it is currency, as
    # above.
    #
    # The latest move is an SSE heartbeat and a delegated sub-agent stopped when
    # the client that asked for it disconnects. Neither reaches this suite:
    # nothing here delegates, and no test is silent for the fifteen seconds a
    # beat waits for. The heartbeat does reach anyone deploying what this gallery
    # demonstrates, which is the ordinary case rather than an exotic one -- an AWS
    # Application Load Balancer and nginx each close an idle stream at sixty
    # seconds by default, and an agent thinking about a real question is quieter
    # than that. So this is the rarer kind of currency floor: unobservable from
    # inside the repo and load-bearing the moment the demo becomes a deployment.
    # The [spec-tools] half moves to a release where a `many=True` service spec
    # is a tool taking its list under one named argument rather than a refusal at
    # build; no spec here is `many=True`, so this suite reads the same either way.
    "django-ag-ui[spec-tools,harness]>=0.61",
    # Declared because this backend imports it directly -- `ToolGuardConfig`,
    # `AgentDeps`, and `contrib.store` both as an app and as an import path.
    #
    # The floor is where `ToolGuard` learned the vocabulary an in-process spec
    # tool actually speaks. Below it the guard read only the destructive metadata
    # key the drf-mcp bridge stamps, while a spec reaching the agent through
    # `service_specs=` carries `annotations["readOnlyHint"]` instead and nothing
    # translated between them -- so a board write ran unapproved with the guard
    # enabled and the approval card never shown.
    #
    # This gallery is the shape that defect targets, and it was saved only by
    # naming all three writes in `require_approval`. Verified rather than
    # reasoned: drop `create_event` from that set and the deferral disappears at
    # the old floor while it still holds at this one. A floor that holds because
    # of how the config next door happens to be written is not a floor.
    #
    # The release also fixed an attached file's tool result claiming more than it
    # could keep -- the bytes never travel the event stream, so a later turn
    # replayed "its contents are attached" with nothing attached and the model
    # answered confidently about a document it had never read, with no error
    # anywhere. This gallery imports a CSV and then keeps talking about it, which
    # is exactly that multi-turn shape.
    #
    # Raised since with the transport, which requires it anyway, so the declared
    # floor is not left below the one that resolves. What it changed is the
    # drf-mcp bridge: a tool-level failure is raised rather than returned, so a
    # refused bridged call is marked failed and keeps its code and chain step in
    # the text. Nothing here uses that bridge; stating it keeps this comment
    # honest about a floor that buys this gallery nothing it can observe.
    #
    # Raised once more with the transport, which requires it anyway. This one
    # buys not merely nothing observable but nothing whatsoever: the release
    # changes no code in django-pydantic-agent at all, it only raises that
    # package's own extras onto the drf-mcp band its dependents now declare. The
    # reason to state it is unchanged -- a declared floor below the one that
    # resolves is a claim this repo is not making on purpose.
    "django-pydantic-agent>=0.24",
    # The admin surface: the same board through django.contrib.admin, with the
    # agent in the admin sidebar and the vendored web-component bundle.
    #
    # The floor is where the sidebar's conversation became scoped to the
    # signed-in principal. The component keeps it in `sessionStorage`, which is
    # scoped to the *tab* and not to the session, so it outlives the navigation a
    # logout is -- and a shared demo machine is exactly the shape that bites:
    # one browser, several principals, the next one landing on the last one's
    # transcript. `tests/test_admin_surface.py` asserts the attribute is
    # rendered, so this floor is load-bearing rather than aspirational.
    #
    # Two standing arguments govern this pin, and they are why it moves at all.
    #
    # First, the invariant: this floor must name the release whose vendored web
    # component matches what the four frontends resolve. Below it the admin
    # surface and the frontends run different builds of one component, and a
    # gallery demonstrating two versions of the same thing is worse than a
    # gallery one release behind. That is the reason to move this pin whenever
    # the frontends move, even when nothing in the admin needs it.
    #
    # Second, the corollary, which is the half a diff does not show: when an
    # admin release re-vendors *nothing*, this pin moves alone and the
    # frontends' ranges correctly stay put. That is not the split the invariant
    # forbids -- it is the invariant holding. Raising this alone is only correct
    # while that is true, so check it rather than infer it from the fact that
    # nothing broke.
    #
    # What the floor buys, cumulatively and without restating which release
    # bought which -- the numbers belong in the pin:
    #
    #   - The sidebar's agent can move the panel it is speaking from: send it to
    #     a corner, minimise it, put it back. Worth demonstrating here because a
    #     chat mounted in the page it is discussing is the only kind that can be
    #     in the way. Nothing configures it; the tools are on by default, so the
    #     floor is the whole adoption.
    #   - A tool call the agent's target refuses renders as failed rather than
    #     as a card indistinguishable from a success.
    #   - The reasoning docs no longer promise that a chain-of-thought reaches a
    #     browser only once an operator enables a thinking budget. It is not a
    #     promise anyone can keep, and a gallery is read as a worked example, so
    #     it is the wrong place to learn a guarantee that was never there. That
    #     release re-vendored nothing, so it was the corollary above in practice.
    #   - A message sent to a chat with no endpoint says so, instead of clearing
    #     the composer and rendering the user's own bubble as though it had gone.
    #     This release *does* re-vendor, so the frontends' ranges move in the same
    #     change -- the invariant's ordinary case rather than its corollary, and
    #     the reason both halves are stated here.
    #   - A signed-out visitor is handed nothing: the admin's login page renders
    #     `base_site.html` like every other page, and the sidebar context carries
    #     a route manifest built from the whole admin registry without filtering
    #     by permission.
    #   - The vendored component labels a tool call that never returned as not
    #     finished, including one restored by a reload while it waited for
    #     approval, where it used to show a spinner that never settled; and
    #     opening the conversation list moves focus into it. This release
    #     re-vendors, so the frontends' ranges move in the same change. It also
    #     names the signed-in user in a full-page chat's greeting, which this
    #     gallery's admin chat does not show at the default placement it keeps,
    #     and renders a refused call from a bridged MCP server as failed, where
    #     this admin mount bridges no server. Neither of those halves reaches
    #     this gallery.
    #   - The vendored component stops drawing an empty ARGUMENTS region on a
    #     tool call made with no arguments, stops an empty row of skill chips
    #     taking space above the composer, and repairs four things about a
    #     checkpoint continuation: it waits for the run in flight, is let go of
    #     when its first save fails, keeps the continued exchange with its
    #     conversation, and parks a turn typed before the resumed run has begun.
    #     That last set is the half that lands here rather than passing over,
    #     because this gallery has a checkpoint panel and a scenario that resumes
    #     from one. On a viewport 600px and under the composer now stays at the
    #     foot of the panel with the greeting over the space above it. This
    #     release re-vendors, so the frontends' ranges move in the same change.
    "django-admin-agent>=0.45.0",
    # Declared because `agent/tools.py` and `agent/scripted.py` import it
    # directly: `RunContext` and `ToolReturn` for the server-side tools, and
    # `FunctionModel` plus the message parts for the scripted stand-in. It arrives
    # under django-ag-ui and django-pydantic-agent both, which is why rule 1
    # exists at all -- this is the file whose own comment says so.
    #
    # `-slim`, not the `pydantic-ai` meta package: which provider extra to install
    # is the reader's choice, and `agent/model.py` says how to make it. No floor
    # above the major, because every surface named above has been there since the
    # 2 line opened; the ceiling is there because a major is a different library.
    "pydantic-ai-slim>=2,<3",
    # Declared because `agent/tools.py` builds a `StateSnapshotEvent` itself --
    # the AG-UI wire type that carries shared state back to the page. Rule 1
    # again: it is django-ag-ui's dependency, and this backend's import.
    "ag-ui-protocol>=0.1.19",
    # ASGI is required: the agent endpoint streams.
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.9",
    # Rule 1 covers the tests too: `tests/test_admin_surface.py` imports
    # `sync_to_async` itself rather than reaching it through Django.
    "asgiref>=3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "demo.settings"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
