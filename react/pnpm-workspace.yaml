# pnpm refuses a version published inside its `minimumReleaseAge` window, so a
# same-day component release is invisible here for a day. That is a sensible
# default and it has one consequence worth writing down, because the obvious
# reading of the setting below is wrong.
#
# `minimumReleaseAgeExclude` only lifts the gate for a version you name
# *explicitly* -- `pnpm add @artooi/ag-ui-web-component@X.Y.Z`. It does **not**
# make the range in package.json resolve to an immature version: with 0.29.0
# listed here and the range `>=0.27.0 <1.0.0`, a lockfile deleted and rebuilt
# from scratch still resolves 0.28.0. Verified, not assumed.
#
# So there are two ways to adopt a fresh component release, and the list is only
# involved in one of them: name the version explicitly and add it here, or wait a
# day and let the range pick it up on its own. Entries can be dropped once no
# lockfile mentions them and the versions have aged past the window.
#
# One further trap, from the same family: **`pnpm update` rewrites the range**.
# It replaces `>=0.27.0 <1.0.0` in package.json with a caret, and a caret on a
# `0.x` pins the minor -- so the one command that looks like "keep up with the
# component" is the command that stops these apps tracking it. Bump by editing
# the range, or restore it afterwards.
minimumReleaseAgeExclude: []
