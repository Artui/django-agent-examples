# Two scheduled questions about upstream, one job each.
#
# ## Has an upstream Python release moved under the backend?
#
# `backend/uv.lock` is what every other job resolves against, so a dependency
# that `pyproject.toml` leaves open can still be frozen everywhere it is tested.
# The family's packages each measure that gap for themselves; nothing measured
# it for the gallery, which is the only place they are composed. This job
# ignores the lock, resolves the newest versions the manifest allows, and runs
# the backend's checks and suite against them. It also fails when a direct
# dependency resolves below its newest release, which is how every resolve of
# this stack stopped at pydantic-ai-slim 2.46 for weeks with nothing failing.
#
# It fails, and files an issue, because a regression there is real: something a
# fresh install of the gallery would get today does not work.
#
# ## Is the next TypeScript major adoptable yet, per app?
#
# Three of the four frontends cannot take TypeScript 7 today, and in every case
# the blocker is the framework's type-checker rather than this repository:
# `vue-tsc` resolves `typescript/lib/tsc`, which 7 no longer exports;
# `svelte-check` refuses outright unless both 6 and 7 are installed and a
# `--tsgo` flag is passed; the Angular compiler plugin crashes during
# initialisation. React is already on 7 and builds, which is the whole reason
# this is worth measuring rather than assuming: the answer is per-app and it
# changes without anyone here doing anything.
#
# `.github/dependabot.yml` ignores the TypeScript major for those three so a
# weekly PR that cannot go green stops being opened. **This job is the other
# half of that decision.** An ignore on its own is how a park quietly becomes
# permanent; this tries the thing every week and says when the ignore can go.
#
# That job never fails. A red X there would train everyone to skip it, and the
# finding is a report rather than a regression -- nothing in this repository is
# broken when an upstream tool has not caught up yet.
name: upstream drift

on:
  schedule:
    # Thursday morning, after the family's other drift jobs, so a week's
    # upstream movement is already visible when this reports on top of it.
    - cron: "0 7 * * 4"
  workflow_dispatch:

concurrency:
  group: upstream-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  backend-resolve-latest:
    name: backend, resolved unpinned
    runs-on: ubuntu-latest
    # Named once, here, for the same reason as the readiness job's: the step
    # that opens the issue and the step that closes it find it by this exact
    # title, and a copy in each script is how the two would drift apart.
    env:
      ISSUE_TITLE: "upstream drift: the backend's unpinned resolve is failing"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # The newest Python, as in the family's own drift jobs: it is where an
      # upstream release lands first.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Resolve the newest versions pyproject allows
        run: uv lock --upgrade

      - name: Report what changed against the committed lock
        # The most useful line in the log when this fails: it names the
        # upgrade that broke the build.
        run: git --no-pager diff --stat uv.lock || true

      - name: Install
        id: install
        run: uv sync --all-groups

      - name: Show the resolved versions
        run: uv pip list

      # A resolve can succeed by backing off. When the newest release of a
      # direct dependency conflicts with something else this project requires,
      # uv takes the newest version that does resolve and logs an ordinary
      # "Updated" line, so the suite below passes against a release nobody
      # chose. That is how django-ag-ui's run went green with pydantic-ai-slim
      # at 2.46 and 2.54 out, and this backend declares slim directly, so it
      # sat at 2.46 too. This fails on a direct dependency held below a release
      # older than the Dependabot cooldown, and asks uv what holds it. A
      # ceiling declared in pyproject.toml is honoured, which is how a hold is
      # accepted on purpose.
      - name: Check no direct dependency is held back
        id: held-back
        uses: Artui/held-back-check@b64bbb88fd63c9c96675caba477cce13714de93e # v0.1.0
        with:
          working-directory: backend

      # The same three steps as the backend job in tests.yml. Each runs whether
      # or not the check above failed: they answer a different question, and a
      # hold is no reason to stop measuring what did resolve.
      - name: Django checks
        id: checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync python manage.py check
      - name: Migrations are complete
        id: migrations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync python manage.py makemigrations --check --dry-run
      - name: Suite
        id: suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync python -m pytest -q

      - name: Open or update an issue on failure
        # Main only. A dispatch on any other branch is a trial of that branch's
        # manifest, and an issue saying the unpinned resolve is failing would be
        # filed against the wrong tree.
        if: failure() && github.ref == 'refs/heads/main'
        env:
          HELD_BACK: ${{ steps.held-back.outcome }}
          REPORT: ${{ steps.held-back.outputs.report }}
          CHECKS: ${{ steps.checks.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          SUITE: ${{ steps.suite.outcome }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            // Matched by title, never by label alone: the TypeScript readiness
            // issue carries the same label, and commenting on whichever
            // labelled issue comes first would file this report there.
            const title = process.env.ISSUE_TITLE;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sections = [];
            const failed = [
              ["CHECKS", "`manage.py check`"],
              ["MIGRATIONS", "`makemigrations --check`"],
              ["SUITE", "the suite"],
            ].filter(([key]) => process.env[key] === "failure").map(([, name]) => name);
            if (failed.length) {
              sections.push([
                `The weekly unpinned resolve failed ${failed.join(", ")}. A dependency`,
                "released a version that `backend/pyproject.toml` admits and the gallery",
                "does not survive.",
                "",
                "The `git diff --stat uv.lock` step in that run names what moved.",
              ].join("\n"));
            }
            if (process.env.HELD_BACK === "failure") {
              sections.push(fs.existsSync(process.env.REPORT)
                ? fs.readFileSync(process.env.REPORT, "utf8")
                : "The held-back check failed before writing its report; the run's log says why.");
            }
            if (!sections.length) {
              sections.push("A step before the checks failed; the run's log names it.");
            }
            const body = [
              ...sections,
              "",
              `Run: ${run}`,
              "",
              "Fix forward (adopt the new version) or add a floor/ceiling that says",
              "why, but do not silence the job: a fresh install of the gallery gets",
              "exactly what this resolved.",
            ].join("\n");
            // Created here rather than assumed, as the readiness job does: a
            // missing label is a confusing way for a report to fail. An existing
            // label 422s and the catch swallows exactly that.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: "upstream-drift", color: "d4c5f9",
                description: "Reported by a scheduled upstream check",
              });
            } catch (error) {
              if (error.status !== 422) { throw error; }
            }
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "upstream-drift",
            });
            const match = existing.data.find((issue) => issue.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["upstream-drift"],
              });
            }

      # The cause is gone when the job passes: the resolve, the install, the
      # held-back check and the three checks after it, which is exactly the set
      # whose failure files the issue above. The closing comment carries the
      # run and the held-back check's report, which it writes on a pass too and
      # which lists anything newer still inside the cooldown. Nothing is opened
      # on a pass, and the comment is posted once: a closed issue is not found
      # again by the open-issue lookup. Main only, like the step above: a pass
      # on another branch says nothing about the tree the issue was filed
      # against.
      - name: Close the issue once the resolve passes
        if: success() && github.ref == 'refs/heads/main'
        env:
          REPORT: ${{ steps.held-back.outputs.report }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "upstream-drift",
            });
            const match = existing.data.find((issue) => issue.title === process.env.ISSUE_TITLE);
            if (!match) {
              return;
            }
            const report = fs.existsSync(process.env.REPORT)
              ? fs.readFileSync(process.env.REPORT, "utf8")
              : "The held-back check passed without writing its report; the run's log has its output.";
            const body = [
              "The weekly unpinned resolve passed: the newest versions",
              "`backend/pyproject.toml` admits install, no direct dependency is held",
              "back, and `manage.py check`, `makemigrations --check` and the suite are",
              "green. Closing; a later failure opens a new issue.",
              "",
              `Run: ${run}`,
              "",
              report,
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: match.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: match.number, state: "closed", state_reason: "completed",
            });

  typescript-next-major:
    name: is the next TypeScript major adoptable, per app
    runs-on: ubuntu-latest
    # Named once, here: the step that opens the issue and the step that closes
    # it both find it by this exact title, and a copy in each script is how
    # the two would drift apart.
    env:
      ISSUE_TITLE: "upstream: is the next TypeScript major adoptable yet?"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `version` is required here and not merely tidy: this job runs from the
      # repository root, which has no package.json, so the action has no
      # `packageManager` field to read one from. tests.yml gets away with
      # nothing more only because it runs inside an app. Kept at the same major
      # tests.yml uses, so the two never build with different pnpm.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Each app is installed and built on its own, exactly as tests.yml does,
      # because that is the claim being tested: not "does TypeScript 7 install"
      # but "does this app's own type-checker still work under it". The build
      # script is the app's own, so vue-tsc, svelte-check and ng build each get
      # their real say.
      #
      # The manifest is rewritten on purpose and never committed. `pnpm add`
      # is deliberately not used: it rewrites the range into a caret as a side
      # effect, which is the trap the four apps' pnpm-workspace.yaml files
      # already warn about at length. Here the rewrite is the point, but it is
      # done explicitly so it cannot be mistaken for an adoption.
      - name: Try the next TypeScript major in each app
        id: probe
        run: |
          echo "results<<EOF" >> "$GITHUB_OUTPUT"
          for app in react vue svelte angular; do
            before="$(node -p "
              const p = require('./$app/package.json');
              ({...p.dependencies, ...p.devDependencies}).typescript ?? '(none)'
            ")"
            node -e "
              const fs = require('fs');
              const path = './$app/package.json';
              const p = JSON.parse(fs.readFileSync(path, 'utf8'));
              for (const section of ['dependencies', 'devDependencies']) {
                if (p[section] && p[section].typescript) { p[section].typescript = 'latest'; }
              }
              fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\n');
            "
            if (cd "$app" && pnpm install --no-frozen-lockfile >/dev/null 2>&1 \
                && pnpm build >/dev/null 2>&1); then
              verdict="ok"
            else
              verdict="blocked"
            fi
            resolved="$(cd "$app" && node -p "
              try { require('typescript/package.json').version } catch { '(unresolved)' }
            " 2>/dev/null || echo "(unresolved)")"
            # The majors the range the app declares today admits, so the report
            # can tell an app that has adopted the probed major from one that
            # merely builds under it. The registry answers rather than a semver
            # parser here: `npm view` lists the published versions a range
            # admits. npm answers `(none)` and a range admitting nothing alike,
            # with an `E404` error object, which reads as no majors at all.
            #
            # Any other error is the registry not answering, and so is output
            # that is not JSON at all, which is what npm leaves when it dies
            # before printing. Either ends the step rather than reading as no
            # majors: that would say every app
            # still had to bump, and the issue would be opened or commented on
            # for a change nobody made. With the step failed, the report is
            # skipped and neither issue step runs. `|| true` sits on `npm view`
            # alone, whose exit says nothing the JSON does not; `majors` is a
            # bare assignment, which under the runner's default `bash -e` fails
            # the step when node exits non-zero, so nothing may follow the
            # closing quote. The snippet is in double quotes, so it holds no
            # `"`, `$`, backtick or backslash, which the shell would rewrite.
            # backend/tests/test_upstream_drift_workflow.py runs it on what npm
            # prints in each case: `one-version` fails without the test for an
            # `error`, and `no-such-version` without the one for `E404`.
            admitted="$(npm view "typescript@$before" version --json 2>/dev/null || true)"
            majors="$(ADMITTED="$admitted" node -p "
              let answer;
              try { answer = JSON.parse(process.env.ADMITTED); } catch {
                console.error('npm view printed no JSON: ' + JSON.stringify(process.env.ADMITTED));
                process.exit(1);
              }
              if (answer.error && answer.error.code !== 'E404') {
                console.error('npm view failed: ' + answer.error.code + ': ' + answer.error.summary);
                process.exit(1);
              }
              const versions = [].concat(answer).filter((v) => typeof v === 'string');
              [...new Set(versions.map((v) => v.split('.')[0]))].join(' ')
            ")"
            echo "$app|$before|$resolved|$verdict|$majors" >> "$GITHUB_OUTPUT"
          done
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Discard the rewritten manifests
        if: always()
        run: git checkout -- react/package.json vue/package.json svelte/package.json angular/package.json

      # Besides the report, this sets `state`, which is what decides between
      # the two issue steps below. It has three values:
      #
      # - `blocked`: an app does not build under the next major, or the probe's
      #   output could not be read in full.
      # - `adoptable`: every app builds under it, and at least one does not
      #   declare it yet. The issue stays open, because something is still to
      #   do, and this state fingerprints differently from `blocked`, so the
      #   step below comments once when it is reached: that comment is the
      #   notification that the `ignore` entries can go.
      # - `adopted`: every app declares the next major and builds under it. The
      #   question is answered and the issue closes.
      #
      # It is computed here, from the same lists the report's prose is written
      # from, so the report a step posts and the condition that posted it come
      # from one reading of the probe and cannot disagree.
      - name: Write the report
        id: report
        env:
          RESULTS: ${{ steps.probe.outputs.results }}
        run: |
          python3 - <<'PY' > "${RUNNER_TEMP}/report.md"
          import hashlib
          import os

          lines = [line for line in os.environ["RESULTS"].splitlines() if line.strip()]
          rows = [line.split("|") for line in lines if line.count("|") == 4]
          blocked = [r for r in rows if r[3] != "ok"]
          ready = [r for r in rows if r[3] == "ok"]
          # A declared range can itself contain `|` (`^6 || ^7`), and such a
          # line is dropped from the table. An app nobody could read is not an
          # app that builds, so it keeps the issue open.
          unread = len(lines) - len(rows)


          def declares(row):
              """Whether the app's declared range admits the major it was probed at."""
              return row[2].split(".")[0] in row[4].split()


          # The apps that build under the next major and do not declare it yet.
          # An app already on the next major is probed at it too, so it builds,
          # declares it, and is not here.
          to_bump = [r[0] for r in ready if not declares(r)]

          # Each condition has a case in
          # backend/tests/test_upstream_drift_workflow.py that fails without it:
          # `nothing-probed` holds `rows`, `unreadable-line` holds `unread`,
          # `three-blocked` holds `blocked`, and `one-to-bump` holds `to_bump`.
          # `blocked` is an allow-list of `ok` rather than a match on the word
          # `blocked`: `empty-verdict` and `unknown-verdict` fail without that.
          # `declares` is held in each direction: `all-adopted` fails if it
          # never answers yes, `one-to-bump` if it always does.
          if not rows or unread or blocked:
              state = "blocked"
          elif to_bump:
              state = "adoptable"
          else:
              state = "adopted"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              print(f"state={state}", file=outputs)

          print("Each app was installed and built with `typescript` at `latest`, using")
          print("its own build script -- so `vue-tsc`, `svelte-check` and `ng build` each")
          print("get their real say rather than a version range being read.")
          print()
          if not rows:
              print("**No apps were probed.** The step that builds them produced nothing")
              print("parseable, which is a fault in this job rather than a finding about")
              print("TypeScript.")
          else:
              print("| app | declared today | probed with | result |")
              print("| --- | --- | --- | --- |")
              for row in rows:
                  app, before, resolved, verdict = row[:4]
                  if verdict != "ok":
                      mark = "blocked"
                  elif declares(row):
                      mark = "adopted"
                  else:
                      mark = "adoptable"
                  print(f"| `{app}` | `{before}` | {resolved} | **{mark}** |")
              print()
              if unread:
                  print(f"**{unread} line(s) of the probe's output could not be read** and")
                  print("are missing from the table. That is a fault in this job rather")
                  print("than a finding about TypeScript, and until it is fixed this")
                  print("report cannot say that every app builds.")
                  print()
              if blocked:
                  names = ", ".join(f"`{r[0]}`" for r in blocked)
                  print(f"Still blocked: {names}. The run's log for each says why; the")
                  print("cause has consistently been the framework's type-checker rather")
                  print("than anything in this repository.")
              elif state == "adoptable":
                  print("**Every app builds under the next major**, and these do not declare")
                  print("it yet. For each, delete the `typescript` `ignore` entry under its")
                  print("directory in `.github/dependabot.yml`, which lets the weekly PR make")
                  print("the bump, or bump the range by hand. This issue closes once every")
                  print("app declares the next major.")
                  print()
                  for app in to_bump:
                      print(f'- `{app}`: the entry under `directory: "/{app}"`')
              elif state == "adopted":
                  print("**Every app declares the next major and builds under it.** Nothing")
                  print("is left to adopt. A `typescript` `ignore` entry still in")
                  print("`.github/dependabot.yml` now holds back only the major after this")
                  print("one, and can go.")
              print()
              if ready and blocked:
                  print("An app moving from blocked to adoptable is the signal to delete")
                  print("its `ignore` entry -- one app at a time, since these are four")
                  print("independent installs and nothing forces them to move together.")
          print()
          print("Nothing here is a proposal and nothing is broken. The apps' committed")
          print("manifests and lockfiles are untouched; `tests.yml` is green.")
          print()
          # An app still to bump enters the digest on its own, so an app
          # bumping while others still have to moves the fingerprint even
          # though every verdict is the same `ok` before and after. The open
          # step comments only when it moves, and that is how anyone watching
          # the issue hears of the bump. It enters only then, so every state
          # with nothing to bump fingerprints exactly as it did before adoption
          # was tracked, and the issue gets no comment for the change of format
          # alone.
          digest = hashlib.sha256(
              (
                  "".join(f"{r[0]}:{r[3]}" for r in sorted(rows))
                  + "".join(f"{app}:bump" for app in sorted(to_bump))
              ).encode()
          ).hexdigest()[:12]
          print(f"<!-- typescript-next-major: {digest} -->")
          PY

      # Not on failure only: "still blocked, same as last week" is the expected
      # result for a while, and the issue body is the place that says so. A
      # comment is added only when an app's verdict actually changes, so the
      # thread stays quiet until there is something to do. From main only, like
      # the backend job's issue: a dispatch on a branch is a trial of that
      # branch, and its verdict does not belong in the issue about main.
      #
      # Only until every app has adopted the next major, though. While an app
      # is blocked, or every app builds and some have still to bump, the issue
      # is where that is said; once every app declares it, the step below
      # closes the issue with this same report, and running this one as well
      # would post it twice. Both steps match `state` by exact value, so a run
      # that never wrote it touches the issue in neither direction.
      - name: Open or update the readiness issue
        if: (steps.report.outputs.state == 'blocked' || steps.report.outputs.state == 'adoptable') && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ runner.temp }}/report.md
        with:
          script: |
            const fs = require("fs");
            const title = process.env.ISSUE_TITLE;
            const report = fs.readFileSync(process.env.REPORT_PATH, "utf8");
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [`Run: ${run}`, "", report].join("\n");
            const fingerprint = (body.match(/<!-- typescript-next-major: ([0-9a-f]+) -->/) || [])[1];
            // Created here rather than assumed, because this is the first job in
            // this repository to use it and a missing label is a confusing way
            // for a report to fail. Idempotent: an existing label 422s and the
            // catch swallows exactly that.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: "upstream-drift", color: "d4c5f9",
                description: "Reported by a scheduled upstream check",
              });
            } catch (error) {
              if (error.status !== 422) { throw error; }
            }
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "upstream-drift",
            });
            const match = existing.data.find((issue) => issue.title === title);
            if (!match) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["upstream-drift"],
              });
              return;
            }
            const unchanged = (match.body || "").includes(`<!-- typescript-next-major: ${fingerprint} -->`);
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: match.number, body,
            });
            if (!unchanged) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            }

      # The question has its answer: every app declares the next major and
      # builds under it. Closing on that rather than on "every app could" is
      # deliberate: an issue closed while the `ignore` entries still stand
      # would leave nothing open saying they can go. The closing comment carries
      # the run and the report, which is the last thing the issue says. Nothing
      # is opened when there is no issue to close, and the comment is posted
      # once: a closed issue is not found again by the open-issue lookup, so
      # the next week with everything adopted passes quietly. The next major
      # that blocks an app, or that an app has still to bump, opens a new issue
      # through the step above.
      - name: Close the readiness issue once every app has adopted
        if: steps.report.outputs.state == 'adopted' && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: ${{ runner.temp }}/report.md
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync(process.env.REPORT_PATH, "utf8");
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "upstream-drift",
            });
            const match = existing.data.find((issue) => issue.title === process.env.ISSUE_TITLE);
            if (!match) {
              return;
            }
            const body = [
              "Every app now declares the next TypeScript major and builds under it.",
              "Closing; the next major that blocks an app, or that an app has still",
              "to bump, opens a new issue.",
              "",
              `Run: ${run}`,
              "",
              report,
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: match.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: match.number, state: "closed", state_reason: "completed",
            });
