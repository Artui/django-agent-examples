name: tests

on:
  push:
    branches: [main]
  pull_request:

# These are apps, not libraries. The gate is "it builds, it type-checks, it boots,
# and the agent still drives it" — not a coverage number.

# Actions are pinned to a commit SHA rather than a tag: a tag is mutable, and an
# action owner (or anyone who takes over the account) can silently repoint one at
# new code that then runs with this workflow's token. The trailing version comment
# is not decoration -- Dependabot reads it to know which release the SHA is, and
# rewrites both together when a newer one ships.
jobs:
  backend:
    name: backend and both agent endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install
        working-directory: backend
        run: uv sync --all-groups
      - name: Django checks
        working-directory: backend
        run: uv run python manage.py check
      - name: Migrations are complete
        working-directory: backend
        run: uv run python manage.py makemigrations --check --dry-run
      # Drives the real endpoints the way a client does: a token in a header, a
      # RunAgentInput body, SSE parsed off the wire, the multi-round tool loop, a
      # declined confirmation, and the admin's navigating tools.
      - name: Suite
        working-directory: backend
        run: uv run python -m pytest -q

  floor:
    name: lowest declared versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # A floor is a claim about the *oldest* version that works, and a lockfile
      # can only ever check the newest. Every other job here resolves the newest
      # in-range dependency, so all of them pass while a reader who copies this
      # backend's pyproject.toml into their own project -- which is the whole
      # point of a gallery -- resolves something older and gets a demo that
      # misbehaves.
      #
      # That is not hypothetical here. This backend declared
      # django-pydantic-agent>=0.18 only after the floor was tested by hand: at
      # >=0.17 the board's writes ran with the tool guard enabled and no approval
      # card, and the only thing hiding it was that every write happens to be
      # named in `require_approval`. Nothing failed. A floor that holds because
      # of how the config next door is written is not a floor, and a floor
      # nobody resolves is not checked.
      #
      # `lowest-direct` pins every *declared* dependency to the bottom of its
      # window and lets transitives resolve normally, so this asserts the floors
      # mean what they say. Per PR rather than scheduled, because a floor stops
      # being true when someone uses a newer symbol -- a code change, not the
      # passage of time.
      - name: Use the floor Python
        run: uv python install 3.11
      # `--refresh` because the claim is "what a reader resolving from scratch
      # would get", and the runner's uv cache is shared across runs: without it
      # the resolution is made against whatever package list that cache holds,
      # which can be hours behind the index. Minutes after a sibling release
      # that reads as a floor failure when it is propagation.
      - name: Resolve every declared dependency at its floor
        working-directory: backend
        run: uv lock --resolution lowest-direct --python 3.11 --refresh
      - name: Install that resolution
        working-directory: backend
        run: uv sync --frozen --all-groups --python 3.11
      - name: What it resolved
        working-directory: backend
        run: uv pip list
      - name: Suite
        working-directory: backend
        run: uv run --no-sync python -m pytest -q

  boots:
    name: the gallery boots and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install and seed
        working-directory: backend
        run: |
          uv sync
          uv run python manage.py migrate
          uv run python manage.py seed_board
      - name: Serve under ASGI
        working-directory: backend
        run: uv run uvicorn demo.asgi:application --port 8000 &
      - name: Wait for it
        run: |
          for _ in $(seq 1 30); do
            curl -sf -H 'Authorization: Token demo-token-not-a-secret' \
              http://127.0.0.1:8000/api/events/ > /dev/null && exit 0
            sleep 1
          done
          echo "backend did not come up" >&2
          exit 1
      - name: The board answers
        run: |
          curl -sf -H 'Authorization: Token demo-token-not-a-secret' \
            http://127.0.0.1:8000/api/events/ | grep -q Standup
      - name: The tool catalog carries both kinds of tool
        run: |
          catalog=$(curl -sf -H 'Authorization: Token demo-token-not-a-secret' \
            http://127.0.0.1:8000/agent/tools/)
          echo "$catalog" | grep -q week_overview
          echo "$catalog" | grep -q list_events
      - name: An agent run streams
        run: |
          curl -sf -X POST http://127.0.0.1:8000/agent/ \
            -H 'Authorization: Token demo-token-not-a-secret' \
            -H 'Content-Type: application/json' \
            -d '{"threadId":"ci","runId":"ci-1","messages":[{"id":"m1","role":"user","content":"what is on the board?"}],"tools":[],"context":[],"state":{},"forwardedProps":{}}' \
            | tee /tmp/run.txt | grep -q RUN_FINISHED
          grep -q list_events /tmp/run.txt

  apps:
    name: ${{ matrix.app }} builds and type-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [react, vue, svelte, angular]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - name: Install
        working-directory: ${{ matrix.app }}
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: ${{ matrix.app }}
        run: pnpm build

  # Every other repository in the family scans its history for secrets; this one
  # did not, which is the kind of gap that opens when a repo is created after the
  # hardening pass rather than during it. Public repo, real settings files, four
  # frontends with their own configs -- exactly the shape where a key gets
  # committed once and lives in the history afterwards.
  #
  # `gitleaks git` reads the whole history, not the working tree, so this catches
  # a secret that was committed and later deleted. `fetch-depth: 0` is what makes
  # that possible; the default shallow clone would scan one commit and pass.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan repo + history
        run: gitleaks git --redact --no-banner .

  # One stable name that fans in, so branch protection can require a single
  # context instead of listing the jobs. That matters more here than elsewhere:
  # `apps` is a matrix over the four frontends, so its checks are named per app.
  # Requiring those names directly would mean a fifth frontend merges without
  # ever being required, and a removed one leaves a required check that never
  # reports and blocks every PR forever.
  #
  # `if: always()` with an explicit result check rather than plain `needs:`,
  # because a `needs:` job is *skipped* when a dependency fails -- and a skipped
  # required check reads as pending, which blocks the PR without saying why.
  # Failing loudly is the point.
  tests-passed:
    name: tests
    if: always()
    needs: [backend, floor, boots, apps]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "a required job failed"; exit 1
          fi
