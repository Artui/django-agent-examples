# pnpm can enforce a minimum release age, refusing a version published within the
# last day. Both of these are newer than that window and are wanted anyway: the
# component releases are the fixes this gallery exists to have found.
#
# Two entries, not one, and the outgoing version matters as much as the incoming
# one: the policy checks every entry already in the lockfile before it resolves
# anything, so dropping 0.23.1 from this list while the lock still held it failed
# the install outright rather than upgrading past it. Both can go once the versions
# age past whatever window you run.
minimumReleaseAgeExclude:
  - "@artooi/ag-ui-web-component@0.23.1"
  - "@artooi/ag-ui-web-component@0.24.0"
