# pnpm 11 refuses to run a dependency's install scripts until each is answered
# here, and the answer is per package rather than a blanket allow. It writes this
# block itself with "set this to true or false" as the value and then **fails the
# install** on the next run, which reads as a lockfile problem and is not one.
#
# esbuild is the only true: its install script fetches the platform binary the
# Angular build shells out to, so skipping it breaks the build outright. The other
# three are native accelerators with working fallbacks -- lmdb and msgpackr-extract
# back the on-disk build cache, and @parcel/watcher is only reached in watch mode --
# so they stay off, and both `build` and `watch` were run against these values.
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
# pnpm can enforce a minimum release age, refusing a version published within the
# last day. This one is newer than that window and is wanted anyway: the component
# releases are the fixes this gallery exists to have found.
#
# One entry now, because the lockfile names one version -- but while an upgrade is
# in flight the outgoing version matters as much as the incoming one: the policy
# checks every entry already in the lockfile before it resolves anything, so
# listing only the version you are upgrading *to* fails the install outright
# rather than upgrading past the one you are on. Add both, then let the outgoing
# one drop off once no lockfile mentions it -- and the whole list can go once the
# versions age past whatever window you run.
minimumReleaseAgeExclude:
  - "@artooi/ag-ui-web-component@0.27.0"
