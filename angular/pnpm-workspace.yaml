# pnpm blocks package build scripts by default and, since pnpm 11, fails the
# install rather than warning. The Angular CLI needs these native postinstalls
# (esbuild's binary, lmdb for the build cache), so the allowance is recorded here
# instead of answered at an interactive prompt.
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# pnpm can enforce a minimum release age, refusing a version published within the
# last day. These two are newer than that window and are wanted anyway: the web
# component release is the fix this gallery exists to have found. Both entries can
# be deleted once the versions age past whatever window you run.
minimumReleaseAgeExclude:
  - "@artooi/ag-ui-web-component@0.23.1"
